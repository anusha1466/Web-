<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JavaScript Programs</title>
</head>

<body>

<h2>JavaScript Programs</h2>

<script>
    /* (a) Fibonacci Series */
    var n = parseInt(prompt("Enter n for Fibonacci series:"));
    var a = 0, b = 1, c;
    var fib = "Fibonacci Series:\n";

    for (var i = 1; i <= n; i++) {
        fib += a + " ";
        c = a + b;
        a = b;
        b = c;
    }
    alert(fib);

    /* (b) Table of Numbers and Squares */
    var n2 = parseInt(prompt("Enter n for squares table:"));
    var table = "Number  Square\n";

    for (var i = 1; i <= n2; i++) {
        table += i + "      " + (i * i) + "\n";
    }
    alert(table);
</script>

</body>
</html>
